# ==========================================
# Server Configuration
# ==========================================
server.port=8080

# ==========================================
# MySQL Database Configuration
# ==========================================
spring.datasource.url=jdbc:mysql://localhost:3306/capacity_connect?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=1972
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / Hibernate Configuration
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ==========================================
# JWT Configuration
# ==========================================
# 256-bit (32+ char) secret required for HS256 signing - replace with your own random string in production
app.jwt.secret=CapacityConnectSIH2026SuperSecretKeyForJWTSigningChangeThis
app.jwt.expiration-ms=86400000

# ==========================================
# File Upload Configuration (for certificates, resources, etc.)
# ==========================================
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
app.upload.dir=uploads

# ==========================================
# CORS - Frontend URL (Vite default)
# ==========================================
app.cors.allowed-origins=http://localhost:8080,https://corner-bluff-tubular.ngrok-free.dev

# ==========================================
# Logging
# ==========================================
logging.level.com.capacityconnect=DEBUG
logging.level.org.springframework.security=DEBUG
