<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Capacity Connect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-6">

    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <a href="../index.html" class="inline-flex items-center gap-2">
                <div class="w-10 h-10 bg-indigo-600 rounded-lg flex items-center justify-center text-white font-bold">CC</div>
                <span class="text-xl font-bold text-slate-900">Capacity Connect</span>
            </a>
        </div>

        <div class="bg-white border border-slate-200 rounded-xl p-8 shadow-sm">
            <h1 class="text-2xl font-bold text-slate-900 mb-1">Create your account</h1>
            <p class="text-sm text-slate-500 mb-6">Start building your competency profile today.</p>

            <div id="errorBox" class="hidden mb-4 px-4 py-3 bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg"></div>
            <div id="successBox" class="hidden mb-4 px-4 py-3 bg-green-50 border border-green-200 text-green-700 text-sm rounded-lg"></div>

            <form id="signupForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Full Name</label>
                    <input type="text" id="fullName" required
                        class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
                        placeholder="Jane Doe">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
                    <input type="email" id="email" required
                        class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
                        placeholder="you@example.com">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">I am joining as a</label>
                    <select id="role" required
                        class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
                        <option value="TRAINEE">Trainee</option>
                        <option value="TRAINER">Trainer</option>
                    </select>
                    <p class="text-xs text-slate-400 mt-1">Trainer accounts require admin approval before you can log in.</p>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                    <input type="password" id="password" required minlength="6"
                        class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
                        placeholder="At least 6 characters">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Confirm Password</label>
                    <input type="password" id="confirmPassword" required minlength="6"
                        class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
                        placeholder="Re-enter your password">
                </div>
                <button type="submit" id="submitBtn"
                    class="w-full py-3 bg-indigo-600 text-white font-semibold rounded-lg hover:bg-indigo-700 transition disabled:opacity-60">
                    Create Account
                </button>
            </form>

            <p class="text-center text-sm text-slate-500 mt-6">
                Already have an account?
                <a href="login.html" class="text-indigo-600 font-medium hover:underline">Log in</a>
            </p>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/signup.js"></script>
</body>
</html>
